site_name: z13ctl-plus
site_url: https://aic0d3r.github.io/z13ctl-plus
site_description: "Linux control for the 2025 ASUS ROG Flow Z13 (GZ302, AMD Strix Halo): RGB keyboard and lightbar lighting, fan curves, TDP power limits, CPU undervolt (Curve Optimizer), battery charge limit, presets, and tablet posture — CLI and systemd daemon. Compatible fork of dahui/z13ctl."
site_author: aic0d3r

repo_url: https://github.com/aic0d3r/z13ctl-plus
repo_name: aic0d3r/z13ctl-plus
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - tables

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: getting-started.md
  - Reference:
    - Commands: commands.md
    - Daemon: daemon.md
    - API: api.md
  - Ecosystem: ecosystem.md
  - Protocol: protocol.md
  - Contributing: contributing.md
