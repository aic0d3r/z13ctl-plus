version: 2

project_name: z13ctl-plus

before:
  hooks:
    - go mod tidy

builds:
  - id: z13ctl-plus
    binary: z13ctl-plus
    ldflags:
      - -s -w -X github.com/aic0d3r/z13ctl-plus/cmd.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: z13ctl-plus
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - contrib/systemd/**/*
      - contrib/udev/*

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: z13ctl-plus-pkg
    package_name: z13ctl-plus
    section: utils
    formats:
      - archlinux
      - deb
      - rpm
    homepage: https://github.com/aic0d3r/z13ctl-plus
    maintainer: "aic0d3r <funforfreeapps@gmail.com>"
    description: z13ctl-plus CLI and daemon for ASUS ROG Flow Z13 hardware control
    license: Apache-2.0
    dependencies:
      - systemd
      - dbus
    scripts:
      postinstall: contrib/nfpm/postinstall.sh
      preremove: contrib/nfpm/preremove.sh
      postremove: contrib/nfpm/postremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/z13ctl-plus/LICENSE
      - src: contrib/systemd/user/z13ctl-plus.socket
        dst: /usr/lib/systemd/user/z13ctl-plus.socket
      - src: contrib/systemd/user/z13ctl-plus.service
        dst: /usr/lib/systemd/user/z13ctl-plus.service
      - src: contrib/systemd/system/z13ctl-plus-perms.service
        dst: /usr/lib/systemd/system/z13ctl-plus-perms.service
      - src: contrib/udev/99-z13ctl-plus.rules
        dst: /usr/lib/udev/rules.d/99-z13ctl-plus.rules
    archlinux:
      packager: "aic0d3r <funforfreeapps@gmail.com>"
    overrides:
      archlinux:
        suggests:
          - "ryzen_smu-dkms-git: CPU undervolting via Curve Optimizer"
    rpm:
      group: Applications/System

release:
  github:
    owner: aic0d3r
    name: z13ctl-plus
  draft: false
  prerelease: auto
  # Notes come from the CHANGELOG.md section for the tag, passed by the release
  # workflow as `--release-notes`; no commit list, no header.

changelog:
  disable: true
